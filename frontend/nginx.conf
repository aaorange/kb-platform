server {
    listen 80;

    # 上传体积上限（nginx 默认仅 1MB）。后端精确限制 40MB（按文件字节数），
    # 此处留 2MB 余量给 multipart 表单开销，让超限文件到达后端拿到 JSON 报错
    client_max_body_size 42m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 文档上传：解析 + bge-m3 向量化是 CPU 密集操作，大文档需数分钟，
    # 单独放宽读超时，避免 504
    location /api/knowledge/upload {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # 请求体直通报后端（不在 nginx 落临时盘），大文件省一次磁盘读写
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE 流式问答：必须关缓冲，否则回答整段一次性出现
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 知识图片：MinIO 公开只读桶经 80 端口代理（9000 不对公网暴露，
    # 云安全组无需放行新端口）；/kb-img/<对象> → /knowledge-base/<对象>
    location /kb-img/ {
        proxy_pass http://minio:9000/knowledge-base/;
        proxy_set_header Host $host;
    }
}
